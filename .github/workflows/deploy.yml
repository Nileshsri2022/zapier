# ZapMate CI/CD Pipeline
# Deploys: Web → Vercel, Server/Hooks/Processor/Worker → Render
#
# NOTE: deploy-web is the ONLY path to Vercel production. Vercel's own Git
# integration is switched off via "git.deploymentEnabled": false in
# vercel.json — without that, every push creates a second, ungated Vercel
# deployment that races this job for the production slot.
# Deploy topology: one job per service below (web→Vercel, others→Render),
# each gated on the same "Lint & Test" job.

name: Deploy ZapMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # ============================================
  # LINT & TEST
  # ============================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Both steps hit the network and have flaked (a run failed and then
      # passed on the same commit). Retry a bounded number of times so a
      # transient fetch cannot masquerade as a code failure — but fail loudly
      # when all attempts are exhausted, never fall through to success.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install; then exit 0; fi
            echo "::warning::bun install failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate Prisma Client
        run: |
          for attempt in 1 2 3; do
            if (cd packages/db && bunx prisma generate); then exit 0; fi
            echo "::warning::prisma generate failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Lint
        run: bun run lint

      # `format:check` already existed in package.json but was never wired, so
      # drift accumulated silently (76 files when this was added). It covers
      # code only — .prettierignore excludes the vendored .agents/ skills and
      # all prose, where prettier's markdown pass only churns the source.
      - name: Format check
        run: bun run format:check

      - name: Run server tests
        run: cd apps/server && bun run test

      - name: Run worker tests
        run: cd apps/worker && bun run test

      - name: Run hooks tests
        run: cd apps/hooks && bun run test

      - name: Run web tests
        run: cd apps/web && bun run test

      # The processor owns BasePoller / GoogleSheetsPoller / GoogleCalendarPoller
      # and was previously deployed without ever being tested.
      - name: Run processor tests
        run: cd apps/processor && bun run test

      # @repo/ingress holds the only credential comparison in the system; its
      # adversarial table must run on every change.
      - name: Run ingress tests
        run: cd packages/ingress && bun run test

      # @repo/placeholders holds the one placeholder rule every action uses.
      - name: Run placeholders tests
        run: cd packages/placeholders && bun run test

      # @repo/actions is the one table both the seeded catalog and the worker's
      # executors derive from; drift must fail here.
      - name: Run actions tests
        run: cd packages/actions && bun run test

      # apps/web resolves @repo/types from dist, so build the workspace
      # packages before typechecking or the ratchet sees phantom TS2307s.
      - name: Build workspace packages
        run: bun run build:packages

      - name: Typecheck (ratchet)
        run: node scripts/typecheck-ratchet.mjs

      - name: Build
        run: bun run build

  # ============================================
  # DEPLOY FRONTEND TO VERCEL
  # ============================================
  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ============================================
  # DEPLOY SERVER TO RENDER (Account 1)
  # ============================================
  deploy-server:
    name: Deploy Server (Render)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_SERVER_API_KEY }}

  # ============================================
  # DEPLOY HOOKS TO RENDER (Account 2)
  # ============================================
  deploy-hooks:
    name: Deploy Hooks (Render)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_HOOKS_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_HOOKS_API_KEY }}

  # ============================================
  # DEPLOY PROCESSOR TO RENDER (Account 3 - Free Tier)
  # ============================================
  deploy-processor:
    name: Deploy Processor (Render)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_PROCESSOR_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_PROCESSOR_API_KEY }}

  # ============================================
  # DEPLOY WORKER TO RENDER (Account 4 - Free Tier)
  # ============================================
  deploy-worker:
    name: Deploy Worker (Render)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_WORKER_API_KEY }}
